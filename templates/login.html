<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vortex HOSTING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes orbFloat { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,-20px) scale(1.1)} }
        .orb { position:fixed; border-radius:50%; filter:blur(80px); opacity:0.35; z-index:0; pointer-events:none; }
        .orb1 { width:400px; height:400px; background:#3b82f6; top:-150px; left:-100px; animation:orbFloat 8s ease-in-out infinite; }
        .orb2 { width:350px; height:350px; background:#8b5cf6; bottom:-150px; right:-100px; animation:orbFloat 10s ease-in-out infinite reverse; }
        .premium-card { position:relative; z-index:1; backdrop-filter: blur(20px); background:rgba(18,20,28,0.75) !important; box-shadow:0 25px 70px -15px rgba(59,130,246,0.25), 0 0 0 1px rgba(59,130,246,0.15); }
        .premium-badge { background:linear-gradient(90deg,#f59e0b,#fbbf24,#f59e0b); background-size:200% auto; animation:shimmer 3s linear infinite; -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:700; letter-spacing:0.5px; }
        @keyframes shimmer { to{ background-position:200% center; } }
        .glow-input:focus { box-shadow:0 0 0 3px rgba(59,130,246,0.25) !important; }
        .glow-btn { position:relative; overflow:hidden; }
        .glow-btn::after { content:''; position:absolute; top:0; left:-75%; width:50%; height:100%; background:linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent); transform:skewX(-20deg); transition:left 0.6s ease; }
        .glow-btn:hover::after { left:130%; }
    </style>
</head>
<body class="bg-[#0a0c12] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="premium-card rounded-2xl p-8 w-full max-w-md border border-blue-500/30 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                <i class="fas fa-cloud-upload-alt text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">Vortex <span class="text-blue-400">HOSTING</span></h1>
            <p class="premium-badge text-sm mt-1"><i class="fas fa-crown mr-1"></i>Premium Hosting Solution</p>
        </div>
        
        {% if error %}
        <div class="bg-red-500/20 border border-red-500 rounded-lg p-3 mb-4 text-red-400 text-sm text-center">
            <i class="fas fa-exclamation-triangle mr-2"></i> {{ error }}
        </div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-2">Username</label>
                <input type="text" name="username" required 
                    class="glow-input w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none transition">
            </div>
            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-2">Password</label>
                <input type="password" name="password" required
                    class="glow-input w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none transition">
            </div>
            <button type="submit" 
                class="glow-btn w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-3 rounded-lg transition transform hover:scale-105 shadow-lg shadow-blue-500/30">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </form>
        
        <div class="text-center mt-6">
            <p class="text-gray-600 text-xs">
                <i class="fas fa-shield-alt"></i> Secure Access Only
            </p>
        </div>
    </div>
</body>
</html>
